appId: com.taskbuddy.app
---
# Phase 2: Settings, homeowner role — dark mode toggle + Change password
# validation. Uses the persistent maestro.client account; the one toggle this
# flow flips is flipped back before the flow ends, so repeat runs and other
# flows see the account in its original state.
#
# Selectors: Settings has two switches with their own testIDs. Dark mode is the
# one flipped here because it is local to the device; Push notifications would
# also ask the OS for permission. The SMS and email switches are gone from
# Settings, so their old testIDs are no longer used.
#
# Change password shows its rules as a live checklist and keeps
# "Update password" disabled until they all pass, so the client-side rounds
# assert the checklist rather than an error after Save. The fields keep their
# text until the modal is closed, so each round closes with Cancel first.

- runFlow: _helpers/login_client.yaml
- tapOn:
    id: "btn-home-avatar"
- tapOn: "Settings"
- assertVisible: "Notifications"

# --- Toggle: Dark mode flips on, then back off ---
- tapOn:
    id: "toggle-dark-mode"
- extendedWaitUntil:
    visible:
      id: "toggle-dark-mode"
      checked: true
    timeout: 5000
- tapOn:
    id: "toggle-dark-mode"
- extendedWaitUntil:
    visible:
      id: "toggle-dark-mode"
      checked: false
    timeout: 5000

# --- Change password: empty fields keep Update disabled ---
- tapOn: "Change password"
- assertVisible:
    id: "btn-update-password"
    enabled: false
- tapOn: "Cancel"

# --- Change password: new password too short ---
- tapOn: "Change password"
- tapOn:
    id: "input-current-password"
- inputText: "WrongPassLogin1!"
- tapOn:
    id: "input-new-password"
- inputText: "short"
- tapOn:
    id: "input-confirm-password"
- inputText: "short"
- hideKeyboard
- assertVisible: "At least 8 characters"
- assertVisible:
    id: "btn-update-password"
    enabled: false
- tapOn: "Cancel"

# --- Change password: wrong current password (real API round trip) ---
- tapOn: "Change password"
- tapOn:
    id: "input-current-password"
- inputText: "WrongPassLogin1!"
- tapOn:
    id: "input-new-password"
- inputText: "GoodPass123"
- tapOn:
    id: "input-confirm-password"
- inputText: "GoodPass123"
- hideKeyboard
- tapOn:
    id: "btn-update-password"
- extendedWaitUntil:
    visible: "Current password is incorrect"
    timeout: 15000
- tapOn: "Cancel"
