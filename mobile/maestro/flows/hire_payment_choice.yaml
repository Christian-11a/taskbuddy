appId: com.taskbuddy.app
---
# Hire on a proposal opens the Hire sheet on its payment choice (BACKEND_SCHEMA.md
# §29.4): Wallet or Card under "Pay with". Asserts the choice is offered and
# cancels. Stripe's hosted Checkout runs in a browser Maestro does not drive, so
# the card path end to end is the manual recipe in docs/stripe-setup.md.
#
# Precondition (00_setup_test_accounts.md): the client test account has an
# open job with a pending proposal from the *verified* provider test account,
# as the first card in My Jobs.
- runFlow: _helpers/login_client.yaml
- tapOn: "My Jobs"
- tapOn:
    id: "my-jobs-card-0"
# While proposals wait, the job's main action reads "Review proposals (n)".
- tapOn: 'Review proposals.*'
- extendedWaitUntil:
    visible: "Proposals"
    timeout: 60000
- tapOn:
    id: "applications-accept-.*"
    index: 0
# Hire opens straight on the payment choice; there is no separate confirm first.
- extendedWaitUntil:
    visible: "Pay with"
    timeout: 30000
- assertVisible: "Wallet"
- assertVisible: "Card"
- tapOn: "Cancel"
