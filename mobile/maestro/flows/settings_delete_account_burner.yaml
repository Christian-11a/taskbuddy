appId: com.taskbuddy.app
env:
  BURNER_EMAIL: maestro.signup2@taskbuddy.test
  BURNER_PASSWORD: TestPass123!
---
# Phase 2: delete account, happy path (no blockers — burner has no balance,
# jobs, or escrow). Uses a disposable burner account created this session by
# auth_signup_client_no_confirmation.yaml, NOT the persistent maestro.client
# account.
#
# Settings has a red "Delete account" row. It opens a sheet titled "Delete your
# account?" with "Delete my account" (the confirm) and "Keep my account" under
# it. "Delete my account" appears only on that sheet, so no position anchor is
# needed.
- runFlow: _helpers/launch_fresh.yaml
- tapOn:
    id: "input-email"
- inputText: ${BURNER_EMAIL}
- tapOn:
    id: "input-password"
- inputText: ${BURNER_PASSWORD}
- hideKeyboard
- tapOn:
    id: "btn-sign-in"
- extendedWaitUntil:
    visible: ".*(Skip|Book a service).*"
    timeout: 60000
- tapOn:
    text: "Skip"
    optional: true
- assertVisible: "Book a service"
- tapOn:
    id: "btn-home-avatar"
- tapOn: "Settings"
- tapOn: "Delete account"
- assertVisible: 'Delete your account\?'
- tapOn: "Delete my account"
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 20000
