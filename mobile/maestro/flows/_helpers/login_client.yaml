appId: com.taskbuddy.app
---
# Reusable: log in as the persistent client test account (created by
# 00_setup_test_accounts.md). Included via `runFlow` from every flow that
# needs a signed-in homeowner.
#
# Selects by testID, not visible text. LoginScreen already ships these
# (LoginScreen.tsx:199/226/255) so this costs no app change, and it avoids a
# real ambiguity: the password field's *placeholder* is the literal string
# "Password" and the screen renders a "Password" *label* above it (:217/:225),
# so `tapOn: "Password"` has two candidates. If `id:` turns out not to resolve
# on this RN build, see the plan's Task 3 Step 2 for the text-selector fallback.
- runFlow: launch_fresh.yaml
- tapOn:
    id: "input-email"
- inputText: "maestro.client@taskbuddy.test"
- tapOn:
    id: "input-password"
- inputText: "TestPass123!"
- hideKeyboard
- tapOn:
    id: "btn-sign-in"
# The onboarding slides are a post-login gate keyed by profile id in
# AsyncStorage (src/lib/onboarding.ts), and launch_fresh clears AsyncStorage
# — so they fire on EVERY run, not just for a genuinely new account.
# `optional` so this helper still works if that ever changes.
- extendedWaitUntil:
    visible: ".*(Skip|Find a service).*"
    timeout: 60000
- tapOn:
    text: "Skip"
    optional: true
- extendedWaitUntil:
    visible: "Find a service"
    timeout: 60000
