appId: com.taskbuddy.app
---
# Phase 3: full job creation happy path, Plumbing. Also the runtime check
# bug-log.md flagged for next session: does the native Android time picker
# still work after @react-native-community/datetimepicker was downgraded
# 9.1.0 -> 8.4.4 for the SDK 54 realignment? (Date uses a custom calendar
# component, not the native picker — only the time step exercises it.)
- runFlow: _helpers/login_client.yaml
# Create job starts from the New button on My Jobs; the floating button is gone.
- tapOn: { id: "nav-tab-My Jobs" }
- extendedWaitUntil: { visible: "New", timeout: 15000 }
- tapOn: "New"
# Step 1 asks one question, and that question is the screen's heading.
- extendedWaitUntil: { visible: "What do you need help with?", timeout: 15000 }
- tapOn: "Plumbing"
- tapOn: "Next"
- assertVisible: "Where is the job?"
- tapOn: "Brgy. Sampaguita, Lipa City"
- inputText: "123 Test Street, Lipa City"
- hideKeyboard
- tapOn: "Next"
- assertVisible: "What needs doing?"
- tapOn: "Fix leaking faucet"
- tapOn: "Next"
- assertVisible: "When, and how much?"
- tapOn: "Select a date"
- takeScreenshot: jobs_create_date_picker
