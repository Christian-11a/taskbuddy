appId: com.taskbuddy.app
---
# Phase 1: forgot-password stage 1 only (request the code). Stage 2 needs a
# real 6-digit code from a real inbox — same reasoning as email-OTP signup in
# the design spec (docs/superpowers/specs/2026-08-27-maestro-e2e-testing-design.md
# §3): not automatable without a mailbox capture service, verified by hand instead.
- runFlow: _helpers/launch_fresh.yaml
- tapOn: "Forgot Password?"
- assertVisible: "Forgot Password?"
# No testID on this screen's email field (only LoginScreen ships input-email) —
# select by the unique placeholder instead.
- tapOn: "sample@mail.com"
- inputText: "maestro.client@taskbuddy.test"
- tapOn: "Send Reset Code"
- extendedWaitUntil:
    visible: "Check your email"
    timeout: 15000
- assertVisible: "Reset code"
