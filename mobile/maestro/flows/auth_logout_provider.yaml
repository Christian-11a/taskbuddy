appId: com.taskbuddy.app
---
# Phase 1: provider sign out from Profile, mirroring auth_logout_client.yaml.
- runFlow: _helpers/login_provider.yaml
- tapOn:
    id: "btn-home-avatar"
- tapOn: "Log Out"
- assertVisible: "Are you sure you want to log out?"
- tapOn:
    text: "Log Out"
    below: "Are you sure you want to log out?"
- extendedWaitUntil:
    visible: "Welcome!"
    timeout: 15000
