appId: com.taskbuddy.app
---
# Creates the persistent client test account. Run once (see
# 00_setup_test_accounts.md for the SQL that confirms and funds it).
#
# Stops at the OTP screen deliberately: the account already exists by then, and
# the emailed code is unreadable to Maestro. The SQL confirms it instead.
#
# Register's selectors: the four form fields ship testIDs (input-name,
# input-email, input-password, input-confirm-password) because positional
# selection on the two secure fields is unreliable — a filled secure field stops
# exposing its value to accessibility, so the number of matches for `••••••••`
# changes mid-form and both entries land in the first box. Do not go back to
# placeholder+index here.
- runFlow: _helpers/launch_fresh.yaml
# The Login screen paints before React attaches its press handlers on a cold
# JS bundle, so the first tap after `clearState` is swallowed — the tap
# reports COMPLETED and nothing happens. Settle first, then retry once if we
# are still on Login.
- waitForAnimationToEnd:
    timeout: 10000
# Tapped by TEXT: the sign-up link is a Pressable with its own accessibilityLabel
# "Create an account", and the label is the reliable hook. See maestro/README.md.
- tapOn: "Create an account"
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      # Race guard (see profile_edit_client.yaml / bug-log.md session note,
      # 2026-09-13): this retry can run after the first tap's own navigation
      # already left "Create an account" behind, where it isn't visible text yet —
      # optional so that case is a no-op instead of a hard failure.
      - tapOn:
          text: "Create an account"
          optional: true
- extendedWaitUntil:
    visible: "Create account"
    timeout: 30000
# Sign-up starts with the role step. Homeowner is the "I need help at home"
# card, then Continue opens the details form.
- tapOn: "I need help at home"
- tapOn: "Continue"
- extendedWaitUntil:
    visible:
      id: "input-name"
    timeout: 20000
- tapOn:
    id: "input-name"
- inputText: "Maestro Client"
- tapOn:
    id: "input-email"
- inputText: "maestro.client@taskbuddy.test"
- tapOn:
    id: "input-password"
- inputText: "TestPass123!"
# The confirm field sits under the on-screen keyboard at this point, and an
# element the keyboard covers is not in the hierarchy to be found by id.
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "input-confirm-password"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "input-confirm-password"
- inputText: "TestPass123!"
- hideKeyboard
# The consents do NOT behave alike. The Terms and Privacy row opens a full
# document that has to be accepted, and only data-collection is a plain toggle.
# The row opens Terms first; once Terms is accepted, the next tap opens Privacy.
# Tapping the row once and expecting both ticks silently leaves one unchecked.
- scrollUntilVisible:
    element:
      id: "chk-terms"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "chk-terms"
# Each consent document's accept button sits at the end of its copy. Terms is
# short enough to fit on one screen; Privacy is not, so scroll rather than
# assume — the difference is only content length and will move as copy changes.
- extendedWaitUntil:
    visible: "Terms & Conditions"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "terms-agree"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "terms-agree"
- tapOn:
    id: "chk-terms"
- extendedWaitUntil:
    visible: "Privacy Policy"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "terms-agree"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "terms-agree"

# This one is a straight toggle — no screen, nothing to accept.
- scrollUntilVisible:
    element:
      id: "chk-data-collection"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "chk-data-collection"

- scrollUntilVisible:
    element:
      id: "btn-create-account"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "btn-create-account"
- extendedWaitUntil:
    visible: "Check your email"
    timeout: 60000
