appId: com.taskbuddy.app
---
# Phase 1: full homeowner signup end-to-end, adapted from 00_setup_register_client.yaml
# for a disposable burner account and updated for this environment's current
# state: Supabase's "Confirm email" is OFF here (discovered 2026-09-06), so
# AuthContext.signUp's `res.session` branch fires and the app lands straight on
# the home screen — RegisterScreen's OTP step (`confirmationSent`) never shows.
# If Confirm email is ever switched back on, this flow's final assertion goes
# back to "Check your email" like 00_setup_register_client.yaml's does.
#
# Sign-up starts with a role step: two cards, then Continue. The consents are
# one Terms and Privacy row (it opens each document in turn) plus the
# data-consent row, and the create button is btn-create-account.
#
# Re-running needs a new email each time — this account is not deleted after.
- runFlow: _helpers/launch_fresh.yaml
# Cold-launch swallowed-tap: the Login screen paints before React attaches
# press handlers, so the very first tap after clearState can be a no-op.
- waitForAnimationToEnd:
    timeout: 10000
# Login's link to sign-up reads "Create an account".
- tapOn: "Create an account"
- runFlow:
    when:
      visible: "Welcome back"
    commands:
      # Race guard (see profile_edit_client.yaml / bug-log.md session note,
      # 2026-09-13): this retry can run after the first tap's own navigation
      # already left "Create an account" behind, where it isn't visible text yet —
      # optional so that case is a no-op instead of a hard failure.
      - tapOn:
          text: "Create an account"
          optional: true
- extendedWaitUntil:
    visible: "Create account"
    timeout: 30000
# Role step first: "I need help at home" is the homeowner card.
- tapOn: "I need help at home"
- tapOn: "Continue"
- extendedWaitUntil:
    visible:
      id: "input-name"
    timeout: 20000
- tapOn:
    id: "input-name"
- inputText: "Maestro Signup Burner"
- tapOn:
    id: "input-email"
- inputText: "maestro.signup2@taskbuddy.test"
- tapOn:
    id: "input-password"
- inputText: "TestPass123!"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "input-confirm-password"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "input-confirm-password"
- inputText: "TestPass123!"
- hideKeyboard
# One row covers both documents: the first tap opens Terms, and once Terms is
# accepted the next tap opens Privacy. Each document has its own "I agree".
- scrollUntilVisible:
    element:
      id: "chk-terms"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "chk-terms"
- extendedWaitUntil:
    visible: "Terms & Conditions"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "I agree to the Terms & Conditions"
    direction: DOWN
    timeout: 20000
- tapOn: "I agree to the Terms & Conditions"
- tapOn:
    id: "chk-terms"
- extendedWaitUntil:
    visible: "Privacy Policy"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "I agree to the Privacy Policy"
    direction: DOWN
    timeout: 20000
- tapOn: "I agree to the Privacy Policy"
- scrollUntilVisible:
    element:
      id: "chk-data-collection"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "chk-data-collection"
- scrollUntilVisible:
    element:
      id: "btn-create-account"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "btn-create-account"
# A brand-new account genuinely sees onboarding here (unlike login_client.yaml's
# Skip, which is working around clearState wiping AsyncStorage on a returning
# account) — this is the real first-run onboarding gate.
- extendedWaitUntil:
    visible: ".*(Skip|Book a service).*"
    timeout: 60000
- tapOn:
    text: "Skip"
    optional: true
- extendedWaitUntil:
    visible: "Book a service"
    timeout: 15000
