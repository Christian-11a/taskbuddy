appId: com.taskbuddy.app
---
# Phase 1: wrong password on a real account shows an inline error and does not
# navigate away from Login.
- runFlow: _helpers/launch_fresh.yaml
- tapOn:
    id: "input-email"
- inputText: "maestro.client@taskbuddy.test"
- tapOn:
    id: "input-password"
- inputText: "WrongPassword123!"
- hideKeyboard
- tapOn:
    id: "btn-sign-in"
- extendedWaitUntil:
    visible: "Invalid login credentials"
    timeout: 15000
- assertVisible:
    id: "input-email"
